[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literatureqa"
version = "0.1.0"
description = "基于本地文献与可追溯证据的问答工具"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "streamlit>=1.32,<2", "requests>=2.31,<3"]
semantic = ["sentence-transformers>=3,<6"]

[project.scripts]
literatureqa = "literatureqa.cli:main"

[tool.setuptools.packages.find]
include = ["literatureqa*"]
