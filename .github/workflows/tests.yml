name: 离线测试
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m literatureqa ingest examples/papers --output data/papers.jsonl
      - run: python -m literatureqa ask --corpus data/papers.jsonl --question '关键词检索如何排序？' --demo --output results/demo.json
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[web]" httpx
      - run: python -m unittest discover -s tests -v
